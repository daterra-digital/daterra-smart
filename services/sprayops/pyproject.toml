[project]
name = "sprayops-drone-compliance"
version = "2.0.0"
description = "Drone Buffer Zone & Legal Compliance Engine (SprayOps) for DATERRA Smart 2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "reportlab>=4.2.2",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
