<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/png" href="./icon-daterra-mono.png" />
    <link rel="shortcut icon" type="image/png" href="./icon-daterra-mono.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DATERRA Smart</title>
    <meta name="description" content="PWA SaaS Suite Agrícola - DATERRA Smart" />
    
    <!-- PWA & Mobile Theme -->
    <meta name="theme-color" content="#114037" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DATERRA Smart" />
    <link rel="apple-touch-icon" href="./icon-daterra-mono.png" />
    
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('daterra_theme') || 'mono';
          const favicon = document.getElementById('app-favicon');
          if (favicon) {
            if (theme === 'light') favicon.href = './icon-daterra-light.png';
            else if (theme === 'dark') favicon.href = './icon-daterra-dark.png';
            else favicon.href = './icon-daterra-mono.png';
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F2F2F2] text-slate-800 font-sans antialiased selection:bg-[#3CA64C] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
