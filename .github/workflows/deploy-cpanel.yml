name: Deploy DATERRA Smart to cPanel

on:
  workflow_dispatch: # Apenas acionamento manual no GitHub Actions

concurrency:
  group: "cpanel-deploy"
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Compilar e Sincronizar com o Servidor cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Obter Código do GitHub
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Aplicação (Vite Build para cPanel na Raiz)
        run: npm run build
        env:
          VITE_BASE_URL: '/'
          DEPLOY_TARGET: 'cpanel'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || vars.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAAEoCu91rh6Qlrb0K' }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID || vars.VITE_GA_MEASUREMENT_ID || 'G-8XT304Y480' }}

      - name: Enviar Ficheiros Compilados via FTPS Seguro (TLS Explícito)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }} # Servidor configurado em GitHub Secrets (ex.: ftp.daterra.com.pt)
          username: ${{ secrets.FTP_USERNAME }} # Utilizador configurado em GitHub Secrets
          password: ${{ secrets.FTP_PASSWORD }} # Palavra-passe configurada em GitHub Secrets
          protocol: ftps # Força encriptação TLS explícita (SEC-08)
          security: strict
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/smart.daterra.com.pt/' }} # Diretoria raiz do subdomínio cPanel
          local-dir: ./dist/
