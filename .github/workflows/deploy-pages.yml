name: Deploy DATERRA Smart to GitHub Pages (V-PAGES)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Validar Branch Main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deploy V-PAGES permitido apenas em refs/heads/main."
            exit 1
          fi

      - name: Checkout do Repositório (Histórico Completo para Changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Ambiente Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar Dependências Limpas
        run: npm ci

      - name: Compilar e Higienizar Aplicação (Vite Build V-PAGES)
        run: npm run build
        env:
          VITE_DATERRA_ENV: 'pages'
          VITE_ENABLE_ASSISTANT: 'false'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_AGROMONITORING_KEY: ${{ secrets.VITE_AGROMONITORING_KEY }}
          VITE_MOODLE_API_URL: ${{ secrets.VITE_MOODLE_API_URL }}

      - name: Garantir Fallback SPA para GitHub Pages (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload do Artefato de Build (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Criar/Atualizar Tag Automática V-PAGES
        run: |
          RELEASE_BASE=$(node -p "require('./package.json').releaseBase")
          TAG="v${RELEASE_BASE}-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" HEAD
          git push -f origin "refs/tags/${TAG}"
