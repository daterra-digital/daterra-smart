name: Deploy DATERRA Smart to GitHub Pages (Release Aprovada)

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: 'SHA-40 ou Tag Git da Release aprovada (ex: v1.0.1-pages ou eb54766b1fcc54b201ffd6b1a8c51610bd6f3825)'
        required: true
        type: string
      confirm_token:
        description: 'Confirmação obrigatória: introduza estritamente APROVADO'
        required: true
        type: string
      release_version:
        description: 'Identificador da Versão (ex: v1.0.1-pages)'
        required: true
        default: 'v1.0.1-pages'
        type: string

# Permissões necessárias para autenticação OIDC e publicação no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy simultâneo, cancelando execuções redundantes em fila
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Validar Parâmetros de Aprovação
        env:
          CONFIRM_TOKEN: ${{ inputs.confirm_token }}
          APPROVED_REF: ${{ inputs.approved_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_TOKEN" != "APROVADO" ]; then
            echo "::error::Confirmação textual inválida ('$CONFIRM_TOKEN'). Requer estritamente 'APROVADO'."
            exit 1
          fi
          if [ -z "$APPROVED_REF" ]; then
            echo "::error::A referência aprovada não pode estar vazia."
            exit 1
          fi
          echo "Publicação manual autorizada para a referência: $APPROVED_REF (Release: $RELEASE_VERSION)"

      - name: Checkout do Repositório (Referência Aprovada)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}

      - name: Configurar Ambiente Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar Dependências Limpas
        run: npm ci

      - name: Compilar Aplicação (Vite Build)
        run: npm run build
        env:
          VITE_DATERRA_ENV: 'pages'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_AGROMONITORING_KEY: ${{ secrets.VITE_AGROMONITORING_KEY }}
          VITE_MOODLE_API_URL: ${{ secrets.VITE_MOODLE_API_URL }}

      - name: Fallback SPA para GitHub Pages (404.html)
        run: cp dist/index.html dist/404.html

      - name: Gerar Manifesto da Release Publicada
        env:
          APPROVED_REF: ${{ inputs.approved_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          node -e '
            const fs = require("fs");
            const manifest = {
              publishedAt: new Date().toISOString(),
              approvedRef: process.env.APPROVED_REF,
              releaseVersion: process.env.RELEASE_VERSION,
              environment: "github-pages",
              workflow: "deploy-pages.yml",
              nodeVersion: process.version
            };
            fs.writeFileSync("./dist/release-manifest.json", JSON.stringify(manifest, null, 2));
          '

      - name: Upload do Artefato de Build (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
