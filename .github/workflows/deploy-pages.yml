name: Deploy DATERRA Smart to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Permissões necessárias para autenticação OIDC e publicação no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy simultâneo, ignorando execuções em fila
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar Dependências Limpas
        run: npm ci

      - name: Compilar Aplicação (Vite Build)
        run: npm run build

      - name: Upload do Artefato de Build (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
